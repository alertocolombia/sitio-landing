:root {
  /* ============================================================
     COLOR SYSTEM
     Drawn from product palette + studio cyclorama photography.
     ============================================================ */

  /* —— Neutrals (foundation) —— */
  --vigor-ink:          #0E0E0E;   /* near-black, primary ink */
  --vigor-ink-soft:     #2A2A2A;   /* secondary ink */
  --vigor-graphite:     #6B6B6B;   /* tertiary text, captions */
  --vigor-stone:        #B8AFA1;   /* hairlines on warm bg */
  --vigor-sand:         #EFE3D2;   /* primary brand background */
  --vigor-sand-deep:    #E4D4BC;   /* hover / pressed sand */
  --vigor-sand-light:   #F6EFE3;   /* large surfaces, dividers */
  --vigor-bone:         #E8DECD;   /* "hueso" product colorway */
  --vigor-paper:        #FBF7F0;   /* off-white, alt surface */
  --vigor-white:        #FFFFFF;

  /* —— Product Colorways (also used as accents) —— */
  --vigor-negro:        #0E0E0E;
  --vigor-blanco:       #FFFFFF;
  --vigor-celeste:      #A8CDE3;   /* sky blue */
  --vigor-celeste-deep: #7BAFCB;
  --vigor-gris:         #7E8689;   /* steel grey */
  --vigor-gris-deep:    #5E6669;
  --vigor-oliva:        #5C6747;   /* olive green */
  --vigor-oliva-deep:   #424B33;
  --vigor-hueso:        #E8DECD;   /* bone */
  --vigor-vino:         #6A1729;   /* wine / burgundy — signature accent */
  --vigor-vino-deep:    #4E0E1E;

  /* —— Semantic —— */
  --vigor-bg:           var(--vigor-sand);
  --vigor-bg-alt:       var(--vigor-paper);
  --vigor-surface:      var(--vigor-white);
  --vigor-surface-warm: var(--vigor-sand-light);

  --vigor-fg:           var(--vigor-ink);
  --vigor-fg-1:         var(--vigor-ink);
  --vigor-fg-2:         var(--vigor-ink-soft);
  --vigor-fg-3:         var(--vigor-graphite);
  --vigor-fg-inverse:   var(--vigor-white);

  --vigor-border:       rgba(14,14,14,0.10);
  --vigor-border-soft:  rgba(14,14,14,0.06);
  --vigor-border-strong:rgba(14,14,14,0.22);

  --vigor-accent:       var(--vigor-vino);
  --vigor-accent-fg:    var(--vigor-white);

  --vigor-success:      #5C6747;   /* reuse oliva */
  --vigor-warning:      #B8862B;
  --vigor-danger:       #8B1E2C;

  /* ============================================================
     TYPOGRAPHY
     ============================================================ */
  --vigor-font-display: "Cormorant Garamond", "Cormorant", "Times New Roman", serif;
  --vigor-font-body:    "Manrope", "Inter", system-ui, -apple-system, sans-serif;
  --vigor-font-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

  /* Type scale — modular, generous */
  --vigor-fs-xs:    11px;
  --vigor-fs-sm:    13px;
  --vigor-fs-base:  15px;
  --vigor-fs-md:    17px;
  --vigor-fs-lg:    20px;
  --vigor-fs-xl:    28px;
  --vigor-fs-2xl:   40px;
  --vigor-fs-3xl:   56px;
  --vigor-fs-4xl:   80px;
  --vigor-fs-hero:  112px;

  /* Tracking — wide on display caps, tight on body */
  --vigor-tracking-tight:   -0.01em;
  --vigor-tracking-normal:  0;
  --vigor-tracking-wide:    0.08em;
  --vigor-tracking-wider:   0.18em;
  --vigor-tracking-widest:  0.32em;

  /* Line height */
  --vigor-lh-tight:   1.05;
  --vigor-lh-snug:    1.2;
  --vigor-lh-normal:  1.5;
  --vigor-lh-loose:   1.7;

  /* ============================================================
     SPACING — 4px base grid
     ============================================================ */
  --vigor-space-0:   0;
  --vigor-space-1:   4px;
  --vigor-space-2:   8px;
  --vigor-space-3:   12px;
  --vigor-space-4:   16px;
  --vigor-space-5:   24px;
  --vigor-space-6:   32px;
  --vigor-space-7:   48px;
  --vigor-space-8:   64px;
  --vigor-space-9:   96px;
  --vigor-space-10:  128px;

  /* ============================================================
     RADII — soft, restrained. Cards and inputs use small radii;
     hero pills/buttons are fully rounded.
     ============================================================ */
  --vigor-radius-none: 0;
  --vigor-radius-xs:   2px;
  --vigor-radius-sm:   4px;
  --vigor-radius-md:   8px;
  --vigor-radius-lg:   16px;
  --vigor-radius-pill: 999px;

  /* ============================================================
     SHADOWS — used sparingly. Brand is mostly flat.
     ============================================================ */
  --vigor-shadow-none:  none;
  --vigor-shadow-sm:    0 1px 2px rgba(14,14,14,0.04);
  --vigor-shadow-md:    0 8px 24px rgba(14,14,14,0.06);
  --vigor-shadow-lg:    0 20px 60px rgba(14,14,14,0.10);
  --vigor-shadow-focus: 0 0 0 3px rgba(106,23,41,0.18);

  /* ============================================================
     MOTION — slow, deliberate, editorial.
     ============================================================ */
  --vigor-ease:         cubic-bezier(0.25, 0.1, 0.25, 1);
  --vigor-ease-out:     cubic-bezier(0.16, 1, 0.3, 1);
  --vigor-duration-1:   160ms;
  --vigor-duration-2:   280ms;
  --vigor-duration-3:   480ms;
  --vigor-duration-4:   720ms;
}

/* ============================================================
   SEMANTIC TYPE CLASSES
   ============================================================ */

body {
  font-family: var(--vigor-font-body);
  font-size: var(--vigor-fs-base);
  line-height: var(--vigor-lh-normal);
  color: var(--vigor-fg-1);
  background: var(--vigor-bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* — Wordmark / mega display — Cormorant, light weight, wide tracking, caps */
.vigor-wordmark {
  font-family: var(--vigor-font-display);
  font-weight: 300;
  font-size: var(--vigor-fs-hero);
  letter-spacing: var(--vigor-tracking-widest);
  line-height: var(--vigor-lh-tight);
  text-transform: uppercase;
}

.vigor-h1 {
  font-family: var(--vigor-font-display);
  font-weight: 300;
  font-size: var(--vigor-fs-3xl);
  letter-spacing: var(--vigor-tracking-wider);
  line-height: var(--vigor-lh-tight);
  text-transform: uppercase;
}

.vigor-h2 {
  font-family: var(--vigor-font-display);
  font-weight: 300;
  font-size: var(--vigor-fs-2xl);
  letter-spacing: var(--vigor-tracking-wide);
  line-height: var(--vigor-lh-snug);
  text-transform: uppercase;
}

.vigor-h3 {
  font-family: var(--vigor-font-body);
  font-weight: 500;
  font-size: var(--vigor-fs-lg);
  letter-spacing: var(--vigor-tracking-normal);
  line-height: var(--vigor-lh-snug);
}

.vigor-eyebrow {
  font-family: var(--vigor-font-body);
  font-weight: 500;
  font-size: var(--vigor-fs-xs);
  letter-spacing: var(--vigor-tracking-widest);
  line-height: var(--vigor-lh-snug);
  text-transform: uppercase;
  color: var(--vigor-fg-3);
}

.vigor-body {
  font-family: var(--vigor-font-body);
  font-weight: 400;
  font-size: var(--vigor-fs-base);
  line-height: var(--vigor-lh-normal);
  color: var(--vigor-fg-2);
}

.vigor-body-lg {
  font-family: var(--vigor-font-body);
  font-weight: 300;
  font-size: var(--vigor-fs-md);
  line-height: var(--vigor-lh-loose);
  color: var(--vigor-fg-2);
}

.vigor-caption {
  font-family: var(--vigor-font-body);
  font-weight: 400;
  font-size: var(--vigor-fs-sm);
  letter-spacing: var(--vigor-tracking-normal);
  color: var(--vigor-fg-3);
}

.vigor-meta {
  font-family: var(--vigor-font-body);
  font-weight: 500;
  font-size: var(--vigor-fs-xs);
  letter-spacing: var(--vigor-tracking-wide);
  text-transform: uppercase;
  color: var(--vigor-fg-3);
}

.vigor-price {
  font-family: var(--vigor-font-body);
  font-weight: 500;
  font-size: var(--vigor-fs-md);
  letter-spacing: var(--vigor-tracking-normal);
  color: var(--vigor-fg-1);
  font-variant-numeric: tabular-nums;
}

.vigor-quote {
  font-family: var(--vigor-font-display);
  font-weight: 300;
  font-style: italic;
  font-size: var(--vigor-fs-xl);
  line-height: var(--vigor-lh-snug);
  color: var(--vigor-fg-1);
}

/* ============================================================
   VIGOR · Motion layer
   Micro-interacciones para botones, links, tarjetas y entradas.
   Filosofía: discreto, élastico, rápido. cubic-bezier(0.16,1,0.3,1).
   ============================================================ */

/* ------- Tokens de movimiento ------- */
:root {
  --vigor-ease: cubic-bezier(0.16, 1, 0.3, 1);
  --vigor-ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --vigor-dur-fast: 160ms;
  --vigor-dur: 260ms;
  --vigor-dur-slow: 480ms;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
  }
}

/* ============================================================
   BOTONES — VButton via [data-vbtn]
   ============================================================ */
[data-vbtn] {
  position: relative;
  overflow: hidden;
  transform: translateZ(0);
  will-change: transform, box-shadow;
}

/* Brillo (shine) que cruza el botón al pasar el cursor */
[data-vbtn]::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    115deg,
    transparent 30%,
    rgba(255, 255, 255, 0.22) 50%,
    transparent 70%
  );
  transform: translateX(-110%);
  transition: transform 720ms var(--vigor-ease);
}
[data-vbtn="ghost"]::before { display: none; }
[data-vbtn="secondary"]::before {
  background: linear-gradient(
    115deg,
    transparent 30%,
    rgba(14, 14, 14, 0.08) 50%,
    transparent 70%
  );
}
[data-vbtn]:hover::before { transform: translateX(110%); }

/* PRIMARY — eleva + sombra suave */
[data-vbtn="primary"]:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px -14px rgba(14, 14, 14, 0.55),
              0 4px 10px -6px rgba(14, 14, 14, 0.35);
}
[data-vbtn="primary"]:active {
  transform: translateY(0) scale(0.97);
  transition-duration: 90ms;
  box-shadow: 0 4px 10px -6px rgba(14, 14, 14, 0.4) inset;
}

/* SECONDARY — se rellena con tinta al hover */
[data-vbtn="secondary"] { background-color: transparent; }
[data-vbtn="secondary"]:hover {
  background-color: var(--vigor-ink);
  color: var(--vigor-white);
  transform: translateY(-2px);
}
[data-vbtn="secondary"]:active {
  transform: translateY(0) scale(0.97);
  transition-duration: 90ms;
}

/* ACCENT (vino) — eleva + sombra cálida */
[data-vbtn="accent"]:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px -14px rgba(94, 24, 36, 0.55),
              0 4px 10px -6px rgba(94, 24, 36, 0.35);
  filter: brightness(1.06);
}
[data-vbtn="accent"]:active {
  transform: translateY(0) scale(0.97);
  transition-duration: 90ms;
}

/* GHOST — la línea inferior crece de izquierda a derecha */
[data-vbtn="ghost"] {
  border-bottom-color: transparent !important;
  background-image: linear-gradient(var(--vigor-ink), var(--vigor-ink));
  background-repeat: no-repeat;
  background-position: 0 100%;
  background-size: 100% 1px;
  transition: background-size 360ms var(--vigor-ease),
              letter-spacing 360ms var(--vigor-ease),
              color 200ms;
}
[data-vbtn="ghost"]:hover {
  background-size: 0% 1px;
  background-position: 100% 100%;
  letter-spacing: 0.22em;
}
[data-vbtn="ghost"]:hover::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  height: 1px;
  width: 100%;
  background: var(--vigor-ink);
  transform-origin: left;
  animation: vigor-underline 360ms var(--vigor-ease) forwards;
}
@keyframes vigor-underline {
  0%   { transform: scaleX(0); transform-origin: right; }
  50%  { transform: scaleX(1); transform-origin: right; }
  51%  { transform: scaleX(1); transform-origin: left; }
  100% { transform: scaleX(0); transform-origin: left; }
}

/* ============================================================
   ICON-BOTONES (lupa, usuario, cerrar)
   ============================================================ */
[data-icon-btn] {
  transition: transform 200ms var(--vigor-ease), color 200ms;
  border-radius: 999px;
}
[data-icon-btn]:hover { transform: scale(1.12); }
[data-icon-btn]:active {
  transform: scale(0.9);
  transition-duration: 80ms;
}

/* ============================================================
   ENLACES DE NAVEGACIÓN
   ============================================================ */
[data-vlink] {
  transition: opacity 220ms, color 220ms;
}
[data-vlink]::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -22px;
  height: 1px;
  background: var(--vigor-ink);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 320ms var(--vigor-ease);
}
[data-vlink]:hover { opacity: 1 !important; }
[data-vlink]:hover::after { transform: scaleX(1); }
[data-vlink][data-active="true"]::after { transform: scaleX(1); }

/* ============================================================
   BOLSA — número con pop al cambiar
   ============================================================ */
[data-bag-count] {
  display: inline-block;
  transition: transform 200ms var(--vigor-ease);
}
[data-bag-count].is-bump {
  animation: vigor-bump 420ms var(--vigor-ease);
}
@keyframes vigor-bump {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.4); color: var(--vigor-vino); }
  100% { transform: scale(1); }
}

[data-bag-btn]:hover [data-bag-count] { transform: translateY(-1px); }

/* ============================================================
   TARJETAS DE PRODUCTO
   ============================================================ */
[data-product-card] {
  transition: transform 360ms var(--vigor-ease);
}
[data-product-card]:hover { transform: translateY(-4px); }

[data-quick-pill] {
  transform: translateY(8px);
  transition: transform 360ms var(--vigor-ease), opacity 240ms;
}
[data-product-card]:hover [data-quick-pill] { transform: translateY(0); }
[data-quick-pill]:hover {
  letter-spacing: 0.24em;
  background: var(--vigor-ink) !important;
  color: var(--vigor-paper) !important;
}
[data-quick-pill]:active { transform: translateY(0) scale(0.97); }

/* Swatches en grid */
[data-swatch-mini] {
  transition: transform 200ms var(--vigor-ease), box-shadow 200ms;
}
[data-swatch-mini]:hover {
  transform: scale(1.25);
  box-shadow: 0 0 0 2px var(--vigor-sand);
}

/* ============================================================
   PDP — tallas, swatches grandes, wishlist
   ============================================================ */
[data-size-btn]:hover:not(:disabled) {
  border-color: var(--vigor-ink) !important;
  transform: translateY(-1px);
}
[data-size-btn]:active:not(:disabled) {
  transform: scale(0.94);
  transition-duration: 80ms;
}

[data-sw-large] {
  transition: transform 220ms var(--vigor-ease), outline-offset 220ms;
}
[data-sw-large]:hover { transform: scale(1.08); }
[data-sw-large]:active { transform: scale(0.94); }

[data-wishlist] {
  transition: transform 240ms var(--vigor-ease),
              background-color 240ms,
              color 240ms;
}
[data-wishlist]:hover {
  background: var(--vigor-ink) !important;
  color: var(--vigor-white) !important;
  transform: scale(1.05);
}
[data-wishlist].is-on {
  animation: vigor-heart 520ms var(--vigor-ease);
  color: var(--vigor-vino) !important;
  background: var(--vigor-paper) !important;
}
@keyframes vigor-heart {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.25); }
  55%  { transform: scale(0.92); }
  100% { transform: scale(1); }
}

/* Thumbs de galería */
[data-thumb] { transition: opacity 200ms, transform 220ms var(--vigor-ease); }
[data-thumb]:hover { opacity: 1 !important; transform: translateX(2px); }

/* ============================================================
   CART DRAWER — qty + cierre
   ============================================================ */
[data-qty-btn] {
  transition: background 180ms, transform 160ms;
}
[data-qty-btn]:hover { background: var(--vigor-sand-deep); }
[data-qty-btn]:active { transform: scale(0.85); }

[data-close-btn] { transition: transform 240ms var(--vigor-ease); }
[data-close-btn]:hover { transform: rotate(90deg); }

[data-cart-item] {
  animation: vigor-slide-in 420ms var(--vigor-ease) both;
}
@keyframes vigor-slide-in {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ============================================================
   TILES de colorway
   ============================================================ */
[data-color-tile] {
  transition: transform 480ms var(--vigor-ease);
}
[data-color-tile]:hover { transform: translateY(-3px); }
[data-color-tile] [data-color-caption] {
  transition: transform 480ms var(--vigor-ease), letter-spacing 480ms;
}
[data-color-tile]:hover [data-color-caption] {
  transform: translateY(-4px);
}

/* ============================================================
   ENTRADA EN PANTALLA (montaje)
   ============================================================ */
.va-rise {
  opacity: 0;
  transform: translateY(14px);
  animation: vigor-rise 720ms var(--vigor-ease) forwards;
}
.va-rise-1 { animation-delay: 60ms; }
.va-rise-2 { animation-delay: 140ms; }
.va-rise-3 { animation-delay: 220ms; }
.va-rise-4 { animation-delay: 300ms; }
.va-rise-5 { animation-delay: 380ms; }

@keyframes vigor-rise {
  to { opacity: 1; transform: translateY(0); }
}

.va-fade {
  opacity: 0;
  animation: vigor-fade 600ms var(--vigor-ease) 120ms forwards;
}
@keyframes vigor-fade { to { opacity: 1; } }

/* Anuncio superior — texto que respira muy sutilmente */
.va-marquee-soft {
  animation: vigor-breathe 6s ease-in-out infinite;
}
@keyframes vigor-breathe {
  0%, 100% { opacity: 0.95; }
  50%      { opacity: 0.7; }
}

/* ============================================================
   REVEAL ON SCROLL — fade + slide-up, escalonado
   Activado por IntersectionObserver (.is-visible)
   ============================================================ */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 720ms var(--vigor-ease-out), transform 720ms var(--vigor-ease-out);
  will-change: opacity, transform;
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}
/* Stagger entre hermanos dentro de un mismo contenedor revelado */
[data-bento-tile].reveal:nth-child(1) { transition-delay: 0ms; }
[data-bento-tile].reveal:nth-child(2) { transition-delay: 100ms; }
[data-bento-tile].reveal:nth-child(3) { transition-delay: 200ms; }
[data-bento-tile].reveal:nth-child(4) { transition-delay: 300ms; }
[data-color-tile].reveal:nth-child(1) { transition-delay: 0ms; }
[data-color-tile].reveal:nth-child(2) { transition-delay: 80ms; }
[data-color-tile].reveal:nth-child(3) { transition-delay: 160ms; }
[data-color-tile].reveal:nth-child(4) { transition-delay: 240ms; }

/* ============================================================
   MARQUEE INFINITO — testimonios (Social Proof)
   ============================================================ */
@keyframes vigor-marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.marquee-viewport:hover .marquee-track {
  animation-play-state: paused;
}

@media (prefers-reduced-motion: reduce) {
  .marquee-track { animation: none !important; }
  .reveal { opacity: 1 !important; transform: none !important; }
}

/* ============================================================
   RESPONSIVE — secciones nuevas en mobile
   ============================================================ */
@media (max-width: 900px) {
  /* Bento → 1 columna, tiles auto-alto */

    grid-template-columns: 1fr !important;
    grid-template-rows: none !important;
  }
  .why-bento > * {
    grid-column: auto !important;
    grid-row: auto !important;
    min-height: 320px;
  }
  /* Colorways → stack, tile grande primero y más alto */

  }

    grid-row: auto !important;

  }
  .cw-grid > *:first-child { min-height: 420px; }

/* ============================================================
   HERO — entrada editorial, punto pulsante, scroll indicator,
   flecha del lookbook
   ============================================================ */

/* Eyebrow dot — pulse continuo */
.hero-dot {
  position: relative;
  box-shadow: 0 0 0 0 rgba(106, 23, 41, 0.55);
  animation: vigor-pulse-dot 2s var(--vigor-ease-out) infinite;
}
@keyframes vigor-pulse-dot {
  0%   { box-shadow: 0 0 0 0    rgba(106, 23, 41, 0.55); transform: scale(1); }
  60%  { box-shadow: 0 0 0 10px rgba(106, 23, 41, 0);    transform: scale(1.06); }
  100% { box-shadow: 0 0 0 0    rgba(106, 23, 41, 0);    transform: scale(1); }
}

/* Stagger palabra por palabra en el H1 del hero */
.hero-word {
  display: inline-block;
  opacity: 0;
  transform: translateY(22px);
  animation: vigor-rise 720ms var(--vigor-ease-out) forwards;
  will-change: opacity, transform;
}

/* Imagen del hero — fade in lento */
.hero-img-wrap {
  opacity: 0;
  animation: vigor-fade 1000ms var(--vigor-ease-out) 0ms forwards;
}

/* Flecha del CTA fantasma — desliza al hover */
.hero-arrow {
  display: inline-block;
  margin-left: 2px;
  transition: transform 220ms var(--vigor-ease-out);
}
[data-vbtn="ghost"]:hover .hero-arrow { transform: translateX(4px); }

/* Indicador de scroll */
.hero-scroll {
  opacity: 0;
  animation: vigor-fade 600ms var(--vigor-ease-out) 1400ms forwards;
}
.hero-scroll-line {
  position: absolute;
  left: 0;
  top: -32px;
  width: 1px;
  height: 32px;
  background: var(--vigor-ink-soft);
  animation: vigor-scroll-line 1.6s var(--vigor-ease-out) infinite;
}
@keyframes vigor-scroll-line {
  0%   { transform: translateY(0);    opacity: 0; }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translateY(64px); opacity: 0; }
}

@media (max-width: 900px) {
  .hero-scroll { display: none; }
}

/* ============================================================
   MEGA MENÚ — fade + slide-down, items con barrido
   ============================================================ */
[style] .mega-off,
.mega-off {
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
  transition: opacity 200ms var(--vigor-ease-out), transform 200ms var(--vigor-ease-out);
}
.mega-on {
  opacity: 1 !important;
  transform: translateY(0) !important;
  pointer-events: auto !important;
  transition: opacity 200ms var(--vigor-ease-out), transform 200ms var(--vigor-ease-out);
}

[data-mega-item] {
  position: relative;
  transition: transform 220ms var(--vigor-ease-out), color 220ms;
}
[data-mega-item]::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -3px;
  height: 1px;
  background: var(--vigor-ink);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 300ms var(--vigor-ease-out);
}
[data-mega-item]:hover {
  transform: translateX(3px);
}
[data-mega-item]:hover::after {
  transform: scaleX(1);
}

/* La imagen featured hace un suave zoom */
.mega-on img {
  transition: transform 600ms var(--vigor-ease-out);
}
.mega-on:hover img { transform: scale(1.04); }

/* ============================================================
   TOOLTIPS de iconos (Buscar / Mi cuenta)
   ============================================================ */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translate(-50%, -4px);
  background: var(--vigor-ink);
  color: var(--vigor-sand-light);
  font-family: var(--vigor-font-body);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 6px 10px;
  border-radius: 2px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms var(--vigor-ease-out), transform 200ms var(--vigor-ease-out);
  z-index: 80;
}
[data-tooltip]:hover::after {
  opacity: 1;
  transform: translate(-50%, 0);
}

  const megaTimerRef = React.useRef(null);

    const id = setInterval(() => {
      setAnnounceIdx((i) => (i + 1) % ANNOUNCE_MESSAGES.length);
    }, 5000);
    return () => clearInterval(id);
  }, []);

  // bump del contador de la bolsa
  const prevCountRef = React.useRef(cartCount);
  const countElRef = React.useRef(null);

    if (prevCountRef.current !== cartCount && countElRef.current) {
      const el = countElRef.current;
      el.classList.remove("is-bump");
      void el.offsetWidth;
      el.classList.add("is-bump");
    }
    prevCountRef.current = cartCount;
  }, [cartCount]);

    if (megaTimerRef.current) clearTimeout(megaTimerRef.current);
    setMegaOpen(true);
  };
  const closeMega = () => {

  const hasAlt = Boolean(p.altImage);
  const visibleSws = p.colorways.slice(0, 4);
  const extraSws = Math.max(0, p.colorways.length - 4);
  const lowStock = typeof p.stock === "number" && p.stock > 0 && p.stock < 5;

    e.stopPropagation();
    if (onQuickAdd) onQuickAdd(p);
    else if (onClick) onClick();

      data-product-card

            loading="lazy"

          data-quick-pill
          type="button"
          style={{
            ...pcardStyles.quick,
            opacity: hover ? 1 : 0,
            transform: hover ? "translateY(0)" : "translateY(6px)",
            pointerEvents: hover ? "auto" : "none",
          }}
          onClick={handleQuickAdd}
          aria-label={`Añadir ${p.name} a la bolsa`}
        >
          + Añadir

      <div>

const ALL_SIZES = ["XS", "S", "M", "L", "XL"];
const SORT_OPTIONS = [
  { id: "featured", label: "Destacados" },
  { id: "new", label: "Más nuevos" },
  { id: "priceAsc", label: "Precio · menor a mayor" },
  { id: "priceDesc", label: "Precio · mayor a menor" },
];

const ProductGrid = ({ onProduct, onQuickAdd }) => {
  const [cat, setCat] = React.useState("Todo");
  const [size, setSize] = React.useState(null);   // single-select
  const [colorFilter, setColorFilter] = React.useState(null);
  const [sort, setSort] = React.useState("featured");
  const [sortOpen, setSortOpen] = React.useState(false);
  const sortRef = React.useRef(null);

  // cerrar dropdown al click fuera
  React.useEffect(() => {
    const onDoc = (e) => {
      if (sortRef.current && !sortRef.current.contains(e.target)) setSortOpen(false);
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  const cats = ["Todo", "Tops", "Sets", "Abrigos", "Vestidos"];

  // colores únicos del catálogo
  const allColors = React.useMemo(() => {
    const map = new Map();
    VIGOR_PRODUCTS.forEach((p) =>
      p.colorways.forEach((c) => {
        if (!map.has(c.name)) map.set(c.name, c.hex);
      })
    );
    return Array.from(map.entries()).map(([name, hex]) => ({ name, hex }));
  }, []);

  // pipeline
  let filtered = VIGOR_PRODUCTS;
  if (cat !== "Todo") filtered = filtered.filter((p) => p.category === cat);
  if (colorFilter) filtered = filtered.filter((p) => p.colorways.some((c) => c.name === colorFilter));
  // talla: catálogo mock no carga stock por talla; M/L/S/XS asumidas in-stock, XL agotado
  if (size === "XL") filtered = filtered.filter(() => false);

  if (sort === "new") filtered = [...filtered].sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
  if (sort === "priceAsc") filtered = [...filtered].sort((a, b) => a.price - b.price);
  if (sort === "priceDesc") filtered = [...filtered].sort((a, b) => b.price - a.price);

  const resetAll = () => { setCat("Todo"); setSize(null); setColorFilter(null); setSort("featured"); };

  // Hueco editorial: si el número de productos no completa la última fila (multi de 3)
  const showEditorial = filtered.length > 0 && filtered.length % 3 !== 0;

  return (
    <section style={gridStyles.section}>
      <div style={gridStyles.inner}>
        <div style={gridStyles.head}>
          <div style={gridStyles.topRow}>
            <div>
              <div style={gridStyles.eyebrow}>Tienda</div>
              <h1 style={gridStyles.title}>Toda la colección</h1>
            </div>
            <div style={gridStyles.count}>{filtered.length} piezas</div>
          </div>
        </div>

        {/* Sticky filter bar */}
        <div style={gridStyles.filterBar} role="region" aria-label="Filtros y orden">
          <div style={gridStyles.filterGroups}>
            <div style={gridStyles.filterGroup}>
              <span style={gridStyles.filterLabel}>Categoría</span>
              <div style={gridStyles.chipRow}>
                {cats.map((c) => (
                  <button
                    key={c}
                    style={{ ...gridStyles.chip, ...(cat === c ? gridStyles.chipOn : {}) }}
                    onClick={() => setCat(c)}
                    data-vlink
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            <div style={gridStyles.filterGroup}>
              <span style={gridStyles.filterLabel}>Talla</span>
              <div style={gridStyles.chipRow}>
                {ALL_SIZES.map((s) => (
                  <button
                    key={s}
                    style={{
                      ...gridStyles.chip,
                      ...gridStyles.sizeChip,
                      ...(size === s ? gridStyles.chipOn : {}),
                    }}
                    onClick={() => setSize(size === s ? null : s)}
                  >
                    {s}
                  </button>
                ))}
              </div>
            </div>

            <div style={gridStyles.filterGroup}>
              <span style={gridStyles.filterLabel}>Color</span>
              <div style={gridStyles.swatchRow}>
                {allColors.map((c) => (
                  <button
                    key={c.name}
                    data-sw-large
                    style={{
                      ...gridStyles.swatch,
                      background: c.hex,
                      ...(colorFilter === c.name ? gridStyles.swatchOn : {}),
                    }}
                    onClick={() => setColorFilter(colorFilter === c.name ? null : c.name)}
                    title={c.name}
                    aria-label={`Filtrar por color ${c.name}`}
                  />
                ))}
              </div>
            </div>
          </div>

          <div style={gridStyles.sortWrap} ref={sortRef}>
            <button
              data-icon-btn
              style={gridStyles.sortBtn}
              onClick={() => setSortOpen((v) => !v)}
              aria-haspopup="listbox"
              aria-expanded={sortOpen}
            >
              Ordenar · {SORT_OPTIONS.find((o) => o.id === sort).label}
              <Icon name="chevronD" size={12} />
            </button>
            {sortOpen && (
              <div style={gridStyles.sortMenu} role="listbox">
                {SORT_OPTIONS.map((o) => (
                  <button
                    key={o.id}
                    style={{
                      ...gridStyles.sortItem,
                      background: sort === o.id ? "var(--vigor-sand-deep)" : "transparent",
                      fontWeight: sort === o.id ? 600 : 400,
                    }}
                    onClick={() => { setSort(o.id); setSortOpen(false); }}
                    role="option"
                    aria-selected={sort === o.id}
                  >
                    {o.label}
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>

        <div style={gridStyles.grid}>
          {filtered.length === 0 && (
            <div style={gridStyles.empty}>
              <span style={gridStyles.emptyIcon}><Icon name="search" size={24} /></span>
              <h3 style={gridStyles.emptyTitle}>Sin coincidencias</h3>
              <p style={gridStyles.emptyText}>
                No hay piezas que coincidan con estos filtros. Prueba con otros, o reinicia la búsqueda.
              </p>
              <VButton variant="secondary" onClick={resetAll}>Reiniciar filtros</VButton>
            </div>
          )}

          {filtered.map((p) => (
            <ProductCard
              key={p.id}
              p={p}
              onClick={() => onProduct(p.id)}
              onQuickAdd={onQuickAdd}
            />
          ))}

          {showEditorial && (
            <div style={gridStyles.editorial} data-product-card>
              <img
                src={VIMG("../../assets/products/vigor-dress-vino.jpg")}
                style={gridStyles.editorialImg}
                alt=""
                loading="lazy"
              />
              <span style={gridStyles.editorialEyebrow}>Próximo lanzamiento · Octubre</span>
              <h3 style={gridStyles.editorialTitle}>
                Colección Estudio,<br />en preventa pronto.
              </h3>
              <span style={gridStyles.editorialLink}>Avísame →</span>
            </div>
          )}
        </div>
      </div>
    </section>
  );
};

window.ProductGrid = ProductGrid;

</script>

const PDPStar = ({ filled, half }) => (
  <svg width="12" height="12" viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.5" aria-hidden="true">
    {half && (
      <defs>
        <linearGradient id={`half-${Math.random()}`}>
          <stop offset="50%" stopColor="currentColor" />
          <stop offset="50%" stopColor="transparent" />
        </linearGradient>
      </defs>
    )}
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
  </svg>
);

const StarRow = ({ rating = 4.7, size = 12 }) => {
  // estrellas reales — entera/media/vacía
  const full = Math.floor(rating);
  const half = rating - full >= 0.4 && rating - full < 0.85;
  const total = 5;
  return (
    <span style={{ display: "inline-flex", gap: 1, color: "var(--vigor-vino)" }} aria-label={`${rating} de 5 estrellas`}>
      {Array.from({ length: total }).map((_, i) => {
        const idx = i + 1;
        if (idx <= full) return <PDPStar key={i} filled />;
        if (idx === full + 1 && half) {
          return (
            <span key={i} style={{ position: "relative", display: "inline-flex", width: size, height: size }}>
              <PDPStar />
              <span style={{ position: "absolute", inset: 0, width: "50%", overflow: "hidden" }}>
                <PDPStar filled />
              </span>
            </span>
          );
        }
        return <PDPStar key={i} />;
      })}
    </span>
  );
};

function App() {
  const [route, setRoute] = useState("home");
  const [productId, setProductId] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [items, setItems] = useState([
    { id: "set-energia", name: "Set Energía", color: "Celeste", size: "M", qty: 1, price: 219000, image: VIMG("../../assets/products/energia-set-celeste.jpg") },
  ]);

  const onNav = (r) => { setRoute(r === "collections" ? "plp" : r === "journal" ? "plp" : r); window.scrollTo({ top: 0, behavior: "instant" }); };
  const openProduct = (id) => { setProductId(id); setRoute("pdp"); window.scrollTo({ top: 0, behavior: "instant" }); };
  const addToBag = (p, size, color) => {
    setItems((prev) => {
      const found = prev.findIndex((x) => x.id === p.id && x.size === size && x.color === color);
      if (found >= 0) { const next = [...prev]; next[found] = { ...next[found], qty: next[found].qty + 1 }; return next; }
      return [...prev, { id: p.id, name: p.name, color, size, qty: 1, price: p.price, image: p.image }];
    });
    setCartOpen(true);
  };
  const setQty = (idx, delta) => { setItems((prev) => { const next = [...prev]; next[idx] = { ...next[idx], qty: Math.max(0, next[idx].qty + delta) }; return next.filter((x) => x.qty > 0); }); };

  const product = VIGOR_PRODUCTS.find((p) => p.id === productId);
  const cartCount = items.reduce((s, x) => s + x.qty, 0);
  const quickAdd = (p) => addToBag(p, "M", p.color);

  return (
    <div data-screen-label={route === "home" ? "01 Home" : route === "plp" ? "02 PLP" : "03 PDP"}>
      <TopNav onNav={onNav} cartCount={cartCount} onOpenCart={() => setCartOpen(true)} route={route} />
      {route === "home" && (
        <>
          <Hero onShop={() => onNav("plp")} />
          <WhyVigor />
          <ColorwayStrip onTile={(id) => (id ? openProduct(id) : onNav("plp"))} />
          <EditorialBreak onShop={() => onNav("plp")} />
          <SocialProof />
          <ProductGrid onProduct={openProduct} onQuickAdd={quickAdd} />
        </>
      )}
      {route === "plp" && <ProductGrid onProduct={openProduct} onQuickAdd={quickAdd} />}
      {route === "pdp" && product && <PDP product={product} onAdd={addToBag} />}
      <Footer />
      <CartDrawer open={cartOpen} items={items} onClose={() => setCartOpen(false)} onQty={setQty} />
      <WhatsAppFAB />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Reveal on scroll
(function () {
  function bindReveal() {
    var els = document.querySelectorAll(".reveal:not(.is-visible)");
    if (!("IntersectionObserver" in window)) { els.forEach(function (el) { el.classList.add("is-visible"); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("is-visible"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    els.forEach(function (el) { io.observe(el); });
  }
  var mo = new MutationObserver(function () { bindReveal(); });
  mo.observe(document.getElementById("root"), { childList: true, subtree: true });
  setTimeout(bindReveal, 300);
})();

</script>
